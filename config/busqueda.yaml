# ════════════════════════════════════════════════════════════════
# LITREV-AI — Configuración de búsqueda en APIs
# ════════════════════════════════════════════════════════════════
# Las queries viven aquí, NO en el script (a diferencia de versiones
# anteriores donde estaban hardcodeadas). Editar libremente.

# ── Filtros aplicados tras recuperar de las APIs ─────────────────
filtros:
  # Año mínimo de publicación. null = sin restricción temporal.
  anio_minimo: null
  # Idiomas aceptados (códigos ISO). Vacío = sin filtro de idioma.
  # OpenAlex etiqueta idioma; Semantic Scholar no siempre.
  idiomas: ["en", "es", "eng", "spa", ""]
  # Tipos de obra aceptados en OpenAlex.
  tipos_openalex: ["article", "review-article", "book-chapter"]

# ── OpenAlex ─────────────────────────────────────────────────────
openalex:
  max_por_query: 100
  queries:
    - "[query 1 — términos del tema]"
    - "[query 2]"

# ── Semantic Scholar ─────────────────────────────────────────────
semantic_scholar:
  max_por_query: 100
  queries:
    - "[query 1 — términos del tema]"
    - "[query 2]"

# ── Enriquecimiento de acceso abierto ────────────────────────────
unpaywall:
  # Buscar URL de PDF abierto para los candidatos sin pdf_url.
  habilitado: true
